<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veduis: Coming Soon</title>
<meta name="description" content="Veduis builds web accessibility compliance tools and benchmarks. The site is under construction. In the meantime, everything we do lives at veduis.com.">
<link rel="canonical" href="https://veduis.github.io/">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Cpath d='M18 44 32 18l14 26' fill='none' stroke='%2338bdf8' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b1220;
    --ink: #e8eefb;
    --muted: #a3b1c9;
    --accent: #38bdf8;
    --line: #24314a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 28px;
    background: radial-gradient(900px 520px at 50% -10%, #16233d 0%, var(--bg) 60%) no-repeat, var(--bg);
    color: var(--ink);
    font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }
  .skip { position: absolute; left: -9999px; }
  .skip:focus { left: 12px; top: 12px; background: var(--accent); color: #04121f; padding: 8px 14px; border-radius: 8px; z-index: 5; }
  main { max-width: 560px; }
  .mark {
    width: 56px; height: 56px; margin: 0 auto 26px;
    border-radius: 16px; border: 1px solid var(--line);
    background: linear-gradient(160deg, #16233d, #0d1626);
    display: grid; place-items: center;
  }
  .mark svg { width: 28px; height: 28px; }
  h1 {
    font-size: clamp(1.9rem, 5vw, 2.6rem);
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin: 0 0 14px;
    font-weight: 750;
  }
  p { margin: 0 0 26px; color: var(--muted); font-size: 1.02rem; }
  a.cta {
    display: inline-block;
    text-decoration: none;
    font-weight: 700;
    padding: 13px 26px;
    border-radius: 10px;
    background: #f8fafc;
    color: #090d16;
    border: 1px solid #ffffff;
  }
  a.cta:hover { background: #ffffff; }
  a.cta:focus-visible, a.quiet:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
  .quiet {
    display: inline-block;
    margin-top: 26px;
    font-size: .9rem;
    color: #8fa1bd;
    text-decoration-color: #3d5878;
    text-underline-offset: 3px;
  }
  .quiet:hover { color: #a9d8f5; }
  footer { margin-top: 44px; font-size: .8rem; color: #6f809b; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<main id="main">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M18 44 32 18l14 26" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    </svg>
  </div>
  <h1>Coming soon</h1>
  <p>We are rebuilding this space. Everything we make, from accessibility benchmarks to the compliance scanner, lives at veduis.com.</p>
  <a class="cta" href="https://veduis.com/">Visit veduis.com</a>
  <div>
    <a class="quiet" href="/ada-deadline-calculator/">Looking for the ADA deadline calculator?</a>
  </div>
  <footer>Veduis LLC</footer>
</main>
</body>
</html>
